target_model: 100     # Which per-shadow checkpoint to score from. Integer N
                      # loads `checkpoint_epoch{N}.pth` (final-epoch weights);
                      # the string `best` loads `best_model.pth`. The pipeline
                      # standard is `100` — LiRA / RMIA / Attack-R want the
                      # final, most-overfit shadow weights for the strongest
                      # memorization signature. Do NOT change to `best`
                      # without re-running every attack-side step.
inference_mode: eval  # 'eval' = standard PyTorch (BN uses running stats;
                      # Pollock LT-IQR convention; default for new
                      # benchmarks like CINIC-10).
                      # 'train' = Carlini 2022 Objax-style (BN uses batch
                      # stats, dropout per-module-disabled). Keep for
                      # legacy CIFAR-10 / CIFAR-100 runs whose 256 shadow
                      # logits were already cached under this convention —
                      # mixing modes within one benchmark breaks LiRA.
overwrite: true       # Whether to overwrite logits on disk
batch_size: 1024      # Inference batch size. Optimized path folds the A
                      # augmentations into a single forward pass of size
                      # (batch_size * A). At A=18 the effective fused
                      # batch is 18432 -- conservative, fp32-friendly.
                      # Raise to 2048 if you need extra speed and your
                      # GPU has headroom; lower if OOM (e.g., wrn40-4 +
                      # nb_augmentation=50).
torch_compile: false  # Wrap the model with `torch.compile(mode=compile_mode)`
                      # before inference. fp32-preserving JIT compilation +
                      # (optional) CUDA-graph replay; first batch warms up,
                      # subsequent shadows reuse the compiled graph since
                      # load_state_dict only swaps tensor values. Expected
                      # ~1.5-2x speedup, more on small models. Default off
                      # for back-compat. Enable via --override torch_compile=true.
compile_mode: reduce-overhead   # 'default' | 'reduce-overhead' | 'max-autotune'.
                                # 'reduce-overhead' enables CUDA graphs and is
                                # the recommended choice for inference-only sweeps.
num_workers: 2         # DataLoader workers for one-time GPU materialization
inference_data_augmentations:
  mode: lira_aug
  nb_augmentation: 2    #  2 queries per sample (original + horizontal flip).
  
# Experiment configuration
experiment:
  log_level: info
  checkpoint_dir: experiments/cinic10/wrn28-2/2026-01-21_1044  # Load checkpoints for attack (e.g., experiments/cifar10/wrn28-2/2025-05-12_0056)
