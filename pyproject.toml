[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rare"
version = "0.1.0"
description = "RARE: Reference-Augmented Ranking by Epoch-statistics for Membership-Inference Vulnerability."
requires-python = ">=3.9"
readme = "README.md"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "timm>=0.9",
    "numpy>=1.23",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "lmdb>=1.4",
    "Pillow>=9.5",
]

[tool.setuptools.packages.find]
include = ["rare*"]
exclude = ["scripts*", "experiments*", "configs*", "data*", "papers*"]
